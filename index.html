<html>

<head>
    <title>Bulbasaur Page</title>

    <!-- <link href="bulba-entry.css" rel="stylesheet" type="text/css"> -->

    <style>
* {
  margin: 0;
  padding: 0;
  list-style-type: none;
  box-sizing: border-box;
}

body {
  font-family: sans-serif;
  font-size: 16px;
  color: #121212;
  background-color: #efefef;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 10px;
}

#wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 1000px;
  background-color: #536271;
  border-top: 8px solid black;
  border: 1px solid black;
  border-radius: 0 0 4% 4%;
  padding: 16px;
  position: relative;
  gap: 12px;
}

.name-plate-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 90%;
  max-width: 400px;
  height: 48px;
  background-color: #d0cd94;
  padding: 6px 10px;
  border: 2px solid black;
  box-shadow: 2px 2px 0 black;
  font-size: 1.5rem;
  text-transform: capitalize;
}

.name-plate {
  margin-left: 8px;
  font-weight: bold;
  text-align: center;
}

.stat-plate {
  text-align: center;
  width: 90%;
  max-width: 550px;
  padding: 12px;
  background-color: #bfc4c1;
  border-radius: 60px 8px;
  border: 2px solid black;
  box-shadow: 2px 2px 0 black;
  font-size: 1.2rem;
}

.ivy-portrait {
  margin: 8px 0;
}

.portrait-img {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid black;
  box-shadow: inset 0 0 10px #000000;
}

.move-prev, .move-next, .next, .previous {
  position: absolute;
  /* top: 50%;
  transform: translateY(-50%); */
  width: 250px;
  height: 50px;
  background-color: #40506b;
  border-radius: 20px;
  box-shadow: 0 2px 5px #000000;
  border: 1px solid black;
  padding: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.move-prev {
  left: 8px;
}

.move-next {
  right: 8px;
}

/* .previous, .next {
  color: #e2e2e2;
  background: none;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  text-align: center;
} */

.preview-after{margin-left: auto;}
.preview-before{margin-right:auto}

.previous:hover, .next:hover {
  background-color: #2c3d55;
  box-shadow: inset 0 2px 5px black;
}

.preview-before-pic, .preview-after-pic {
  background-color: #40506b;
  padding: 4px;
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 2px solid black;
  box-shadow: inset 0 2px 10px #000000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.information-plate {
  width: 92%;
  background-color: #bfc4c1;
  border-radius: 10px 80px;
  border: 8px double black;
  padding: 16px;
  font-size: 1rem;
  text-align: left;
}

.description-plate{height:250px;}

h3 {
  font-size: 1.2rem;
  margin-bottom: 6px;
}

.information {
  line-height: 1.4;
  font-size: 0.95rem;
  padding-top: 6px;
}

.pokeball {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.red-ball {
  height: 90px;
  width: 90px;
  background-color: red;
  border-radius: 50%;
  border: 5px solid black;
  box-shadow: 1px 2px 0px black;
}

.white-ball {
  margin-top: -45px;
  height: 45px;
  width: 90px;
  border-bottom-left-radius: 350px;
  border-bottom-right-radius: 350px;
  background-color: white;
}

/* ---------------- Responsive Media Queries ---------------- */

@media (max-width: 768px) {
  .move-prev, .move-next {
    position: static;
    transform: none;
    margin: 8px 0;
    flex-direction: row;
    justify-content: center;
    width: 100%;
  }

  .portrait-img {
    width: 90px;
    height: 90px;
  }

  .stat-plate, .information-plate, .name-plate-wrapper {
    width: 100%;
  }

  .preview-before-pic, .preview-after-pic {
    width: 55px;
    height: 55px;
  }

  .red-ball, .white-ball {
    width: 70px;
  }

  .red-ball {
    height: 70px;
  }

  .white-ball {
    height: 35px;
    margin-top: -35px;
  }
}

@media (max-width: 480px) {
  .name-plate-wrapper {
    font-size: 1.1rem;
  }

  .information {
    font-size: 0.85rem;
  }

  .portrait-img {
    width: 75px;
    height: 75px;
  }

  .preview-before-pic, .preview-after-pic {
    width: 48px;
    height: 48px;
  }
}


    </style>
</head>



<body>


    <div id="wrapper">


        <div class="name-plate-wrapper">
            Name:
            <div class="name-plate"> </div>
        </div>

        <div class="stat-plate">
            <p> Stat Plate </p>
        </div>

        <div class="ivy-portrait">
            <img id="portrait-img" class="portrait-img" src="" alt="Ivysaur Official Artwork" />
        </div>


        <div class="move-prev">
            <button class="previous" onClick="prevImage()">Previous</button>
            <div class="preview-before">
                <div class="preview-before-pic">
                    <img id="prev-img" src="" height="75" width="75" />
                </div>
            </div>
        </div>
        <div id="next" class="move-next">
            <button class="next" onClick="nextImage()">Next</button>
            <div class="preview-after">
                <div class="preview-after-pic">
                    <img id="next-img" src="" height="75" width="75" />
                </div>

            </div>
        </div>
        <div class="information-plate" id="information-plate-background">
            <div class="description-plate">
                <h3> Description : </h3>
                <div class="information">
                </div>
            </div>
        </div>
    </div>


    <div class="pokeball">
        <div class="red-ball"></div>
        <div class="white-ball"></div>
    </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
